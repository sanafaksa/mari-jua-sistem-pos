<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pesan Mari Jua Jastip</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ==============================================================
   Frost UI (Low-Blur Glass) Theme - Pure White Background
   Modern Frosted Glassmorphism with ambient pastel gradients,
   crisp translucent cards, and soft sky-blue glow accents.
   ============================================================== */
:root{
  color-scheme: light !important;
  --bg:#f8fafc;
  --surface:rgba(255, 255, 255, 0.72);
  --surface-hover:rgba(255, 255, 255, 0.9);
  --line:rgba(255, 255, 255, 0.95);
  --field:rgba(255, 255, 255, 0.88);
  --field-border:rgba(226, 232, 240, 0.95);
  --ink:#0f172a;
  --ink2:#64748b;
  --sky:#0ea5e9;
  --sky-light:rgba(224, 242, 254, 0.8);
  --sky-border:#38bdf8;
  --sky-glow:rgba(56, 189, 248, 0.25);
  --wa:#16a34a;
  --bad:#e11d48;
  --bad-soft:rgba(255, 228, 230, 0.85);
  --warn:#92400e;
  --warn-soft:rgba(254, 243, 199, 0.8);
  --warn-border:rgba(245, 158, 11, 0.35);
  --font-display:"Nunito", system-ui, -apple-system, sans-serif;
  --font-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}

*{box-sizing:border-box}
html{color-scheme:light !important;background-color:#ffffff}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{
  background-color:#ffffff !important;
  background-image:
    radial-gradient(at 10% 12%, rgba(186, 230, 253, 0.7) 0px, transparent 55%),
    radial-gradient(at 90% 15%, rgba(254, 215, 170, 0.6) 0px, transparent 55%),
    radial-gradient(at 85% 85%, rgba(224, 231, 255, 0.55) 0px, transparent 55%),
    radial-gradient(at 15% 90%, rgba(204, 251, 241, 0.5) 0px, transparent 55%) !important;
  background-attachment:fixed;
  background-repeat:no-repeat;
  color:var(--ink) !important;
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.55;
  padding-block:24px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}

.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:27px;letter-spacing:-0.3px} h2{font-size:19px}
p{margin:0}
.muted{color:var(--ink2)} .small{font-size:13px}
a{color:var(--sky)}
.hero{display:flex;gap:16px;align-items:center;padding:4px 2px}
.hero img{width:86px;height:86px;border-radius:50%;flex:none;border:2.5px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,0.06);object-fit:cover;background:#fff}
.hero p{margin-top:4px;color:var(--ink2);font-size:14.5px}

/* Frost Alert Banner */
.notice{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border);border-radius:14px;padding:12px 14px;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.notice-final{
  background:var(--warn-soft);
  color:var(--warn);
  border:1.5px solid var(--warn-border);
  border-radius:14px;
  padding:12px 16px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13.5px;
  line-height:1.45;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 4px 15px rgba(245, 158, 11, 0.08);
}
.notice-final i{font-style:normal;font-size:18px;line-height:1;flex:none}

.svc-title{font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px}
.svc-name{font-family:var(--font-display);font-size:15px;font-weight:700;line-height:1.25;color:var(--ink)}
.opt:has(input:checked) .svc-name{color:#0369a1}
.svc-opt{align-items:center;padding:12px 14px}

/* Frost Card Container */
.card{
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:20px;
  padding:20px 22px;
  min-width:0;
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  box-shadow:0 10px 30px -5px rgba(0, 0, 0, 0.04), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
}
.step{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.step i{
  font-style:normal;
  flex:none;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--sky-border);
  color:#ffffff;
  display:grid;
  place-items:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:14px;
  box-shadow:0 3px 10px rgba(56, 189, 248, 0.4);
}
.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink);min-width:0}

/* Frost Inputs */
.in{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--field-border);
  border-radius:12px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-weight:500;
  font-size:14.5px;
  box-shadow:inset 0 1px 2px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.02);
  transition:all 0.18s ease;
  min-width:0;
}
.in::placeholder{color:#94a3b8;font-weight:400;opacity:0.85}
textarea.in{resize:vertical;min-height:84px}
.in:focus,.in:focus-visible{
  outline:none;
  background:#ffffff;
  border-color:var(--sky-border);
  box-shadow:0 0 0 3.5px var(--sky-glow);
}

/* Radio Option Pills */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:440px){.opts{grid-template-columns:1fr}}
.opt{
  display:flex;
  gap:10px;
  align-items:center;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:14px;
  background:var(--surface);
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:all 0.18s ease;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  box-shadow:0 2px 6px rgba(0, 0, 0, 0.02);
}
.opt:hover{
  background:var(--surface-hover);
  border-color:rgba(186, 230, 253, 0.9);
}
.opt:has(input:checked){
  background:var(--sky-light);
  border-color:var(--sky-border);
  box-shadow:0 4px 14px var(--sky-glow);
}
.opt input{
  accent-color:#0284c7;
  margin:0;
  width:17px;
  height:17px;
  cursor:pointer;
}

/* Item box */
.it{
  border:1.5px dashed rgba(186, 230, 253, 0.9);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:rgba(255, 255, 255, 0.45);
}
.it-h{display:flex;justify-content:space-between;align-items:center}
.it-h b{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--ink)}
.it-row{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px}
.x{
  width:34px;
  height:34px;
  border-radius:10px;
  border:1.5px solid var(--line);
  background:var(--surface);
  cursor:pointer;
  font-size:20px;
  line-height:1;
  color:var(--ink2);
  display:grid;
  place-items:center;
  transition:all 0.15s ease;
}
.x:hover{color:var(--bad);border-color:#fda4af;background:#ffe4e6}

/* Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 18px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  font:inherit;
  font-weight:700;
  font-size:14.5px;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  line-height:1.2;
  box-shadow:0 2px 6px rgba(0, 0, 0, 0.03);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:all 0.18s ease;
}
.btn:hover{background:var(--surface-hover);border-color:var(--sky-border);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.wa{
  background:linear-gradient(135deg, #22c55e, #16a34a);
  border:none;
  color:#fff;
  font-size:16px;
  font-weight:800;
  padding:15px 18px;
  border-radius:14px;
  box-shadow:0 8px 24px -4px rgba(34, 197, 94, 0.4);
}
.btn.wa:hover{
  background:linear-gradient(135deg, #16a34a, #15803d);
  box-shadow:0 10px 28px -4px rgba(34, 197, 94, 0.5);
  transform:translateY(-1px);
}
.btn.wa[aria-disabled="true"]{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13.5px}

.sumline{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--ink2)}
.sumline.big{
  font-family:var(--font-display);
  font-size:21px;
  font-weight:800;
  color:var(--ink);
  border-top:1.5px dashed rgba(203, 213, 225, 0.8);
  margin-top:8px;
  padding-top:12px;
}
.err{color:#be123c;font-weight:700;font-size:13.5px;background:var(--bad-soft);border:1px solid rgba(253, 164, 175, 0.6);border-radius:12px;padding:10px 14px}
.err:empty{display:none}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink);font-size:14px}
details{border-top:1px solid rgba(226, 232, 240, 0.8);padding:12px 0}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-weight:700;color:var(--ink)}
details p{margin-top:8px;color:var(--ink2);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.foot{text-align:center;color:#94a3b8;font-size:13px;font-weight:600}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:20;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.toast div{
  background:rgba(15, 23, 42, 0.88);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:#f8fafc;
  padding:11px 20px;
  border-radius:14px;
  font-weight:700;
  font-size:14px;
  box-shadow:0 12px 30px rgba(0, 0, 0, 0.15);
  border:1px solid rgba(255, 255, 255, 0.15);
  max-width:480px;
}
.toast div[hidden]{display:none}
</style>
</head>

function check(){
  if(!D.name.trim())return 'Isi nama Anda dulu.';
  if(waNum(D.wa).length<9)return 'Isi nomor WhatsApp Anda, misalnya 0812 3456 7890.';
  if(D.serviceType==='antar_paket'){
    if(!D.pkgItem.trim())return 'Tuliskan barang yang ingin diantar.';
    if(!D.pkgPickup.trim())return 'Isi tempat/lokasi pengambilan paket.';
    if(!D.pkgDropoff.trim())return 'Isi tempat/lokasi penerimaan paket.';
    return '';
  }
  if(D.ship==='kirim'&&!D.addr.trim())return 'Isi alamat pengiriman, atau pilih ambil sendiri.';
  const its=D.items.filter(i=>String(i.name).trim());
  if(!its.length)return 'Tulis minimal satu barang yang ingin dititip.';
  if(its.some(i=>(+i.qty||0)<1))return 'Jumlah barang minimal 1.';
  return '';
}
function message(){
  const finalNotice='\n\n⚠️ *Catatan:* Orderan yg sudah masuk adalah hasil final. jika ada tambahan, wajib isi kembali form ini.';
  if(D.serviceType==='antar_paket'){
    let m='Halo '+CFG.biz+', saya mau pesan layanan pengantaran paket ya.\n\n'
      +'*FORM PEMESAN UTK JASTIP PENGANTARAN PAKET:*\n'
      +'Nama : '+D.name.trim()+'\n'
      +'No wa pemesan: '+D.wa.trim()+'\n'
      +'barang yg diantar: '+D.pkgItem.trim()+'\n'
      +'tempat pengambilan paket: '+D.pkgPickup.trim()+'\n'
      +'tempat penerimaan paket : '+D.pkgDropoff.trim()+'\n'
      +'waktu pengantaran / kirim: '+(D.shipTime.trim()||'Secepatnya')+'\n'
      +'-jika titip ke orang, atas nama siapa: '+(D.pkgDelegateName.trim()||'-')+'\n'
      +'-no wa org yg dititipkan agar shareloc : '+(D.pkgDelegateWa.trim()||'-');
    if(D.notes.trim())m+='\n\nCatatan tambahan: '+D.notes.trim();
    m+=finalNotice;
    return m+'\n\nMohon dicek dan dikonfirmasi ongkirnya ya. Terima kasih!';
  }

  const its=D.items.filter(i=>String(i.name).trim());
  let est=0,noPrice=0;
  const lines=its.map((i,k)=>{
    const q=+i.qty||1,p=+i.price||0;if(p)est+=q*p;else noPrice++;
    let l=(k+1)+'. '+i.name.trim()+(i.note.trim()?' ('+i.note.trim()+')':'')+'\n    Jumlah: '+q+(p?'  |  Perkiraan harga: '+rp(p)+' /pcs':'');
    if(i.link.trim())l+='\n    Link/Toko: '+i.link.trim();
    return l;
  });
  let m='Halo '+CFG.biz+', saya mau titip beli ya.\n\n*Data pemesan*\nNama: '+D.name.trim()+'\nWhatsApp: '+D.wa.trim()+'\nPengiriman: '+(D.ship==='kirim'?'Dikirim ke '+D.addr.trim():'Ambil sendiri');
  if(D.shipTime.trim()){
    m+='\nWaktu '+(D.ship==='ambil'?'pengambilan':'pengiriman')+': '+D.shipTime.trim();
  }
  m+='\n\n*Daftar titipan*\n'+lines.join('\n');
  if(est)m+='\n\nPerkiraan total barang: '+rp(est)+(noPrice?' (belum termasuk '+noPrice+' barang tanpa perkiraan harga)':'')+', belum termasuk fee jasa dan ongkir.';
  if(D.notes.trim())m+='\n\nCatatan: '+D.notes.trim();
  m+=finalNotice;
  return m+'\n\nMohon dikonfirmasi harga final dan invoicenya ya. Terima kasih!';
}

      +'<label class="f">Kapan waktu pengantaran / kirim (bebas ketik)<input class="in" id="f-shipTime" data-f="shipTime" placeholder="Contoh: Hari ini jam 15.00 / Besok pagi jam 10.00 / Secepatnya" value="'+esc(D.shipTime)+'"></label>'

      +'<label class="f">No WA orang yg dititipkan agar shareloc (boleh dikosongkan)<input class="in" id="f-pkgDelegateWa" data-f="pkgDelegateWa" inputmode="tel" autocomplete="tel" placeholder="0812 3456 7890 (agar kurir bisa minta shareloc)" value="'+esc(D.pkgDelegateWa)+'"></label>'
    +'</div></section>'
    +'<section class="card"><div class="step"><i>3</i><h2>Kirim ke admin</h2></div><div class="stack">'
      +'<label class="f">Catatan tambahan (boleh dikosongkan)<textarea class="in" id="f-notes" data-f="notes" placeholder="Contoh: Tolong antar sebelum jam 15.00, barang rentan">'+esc(D.notes)+'</textarea></label>'
      +'<div class="notice" style="font-size:14px">⚠️ <b>Catatan:</b> Orderan yg sudah masuk adalah hasil final, jika ada tambahan, wajib isi kembali form ini.</div>'
      +'<div id="sum"></div><div class="err" id="err" role="alert"></div>'
      +'<a class="btn wa block" id="send" target="_blank" rel="noopener" href="#">Kirim pesanan pengantaran lewat WhatsApp</a>'
      +'<div class="row"><button type="button" class="btn sm" data-act="copy">Salin pesan</button><button type="button" class="btn sm" data-act="reset">Kosongkan form</button></div>'
      +'<p class="small muted">Admin akan mengecek rute dan membalas dengan ongkos kirim serta konfirmasi kurir.</p>'
    +'</div></section>';
  } else {
    bodyHtml=
    '<section class="card"><div class="step"><i>1</i><h2>Data pemesan</h2></div><div class="stack">'
      +'<label class="f">Nama Anda<input class="in" id="f-name" data-f="name" autocomplete="name" placeholder="Nama Anda" value="'+esc(D.name)+'"></label>'
      +'<label class="f">Nomor WhatsApp Anda<input class="in" id="f-wa" data-f="wa" inputmode="tel" autocomplete="tel" placeholder="0812 3456 7890" value="'+esc(D.wa)+'"></label>'
      +'<div class="opts" role="radiogroup" aria-label="Cara terima barang"><label class="opt"><input type="radio" name="ship" value="kirim" data-f="ship"'+(D.ship==='kirim'?' checked':'')+'>Dikirim</label><label class="opt"><input type="radio" name="ship" value="ambil" data-f="ship"'+(D.ship==='ambil'?' checked':'')+'>Ambil sendiri</label></div>'
      +'<label class="f" id="addrBox"'+(D.ship==='ambil'?' hidden':'')+'>Alamat pengiriman<textarea class="in" id="f-addr" data-f="addr" placeholder="Alamat lengkap, kecamatan, kota, kode pos" autocomplete="street-address">'+esc(D.addr)+'</textarea></label>'
      +'<label class="f" id="shipTimeBox"><span id="shipTimeLbl">'+(D.ship==='ambil'?'Kapan perkiraan diambil (bebas ketik)':'Kapan waktu kirim (bebas ketik)')+'</span><input class="in" id="f-shipTime" data-f="shipTime" placeholder="'+(D.ship==='ambil'?'Contoh: Nanti sore sekitar jam 17.00 / Besok siang':'Contoh: Hari ini jam 16.00 / Besok pagi jam 10.00 / Secepatnya')+'" value="'+esc(D.shipTime)+'"></label>'
    +'</div></section>'
    +'<section class="card"><div class="step"><i>2</i><h2>Barang yang dititip</h2></div><div class="stack" id="items">'+D.items.map(itemHtml).join('')+'</div>'
      +'<button type="button" class="btn sm" style="margin-top:12px" data-act="add">+ Tambah barang</button></section>'
    +'<section class="card"><div class="step"><i>3</i><h2>Kirim ke admin</h2></div><div class="stack">'
      +'<label class="f">Catatan tambahan (boleh dikosongkan)<textarea class="in" id="f-notes" data-f="notes" placeholder="Contoh: tolong cek tanggal kedaluwarsa">'+esc(D.notes)+'</textarea></label>'
      +'<div class="notice" style="font-size:14px">⚠️ <b>Catatan:</b> Orderan yg sudah masuk adalah hasil final, jika ada tambahan, wajib isi kembali form ini.</div>'
      +'<div id="sum"></div><div class="err" id="err" role="alert"></div>'
      +'<a class="btn wa block" id="send" target="_blank" rel="noopener" href="#">Kirim pesanan lewat WhatsApp</a>'
      +'<div class="row"><button type="button" class="btn sm" data-act="copy">Salin pesan</button><button type="button" class="btn sm" data-act="reset">Kosongkan form</button></div>'
      +'<p class="small muted">Anda tidak perlu membayar sekarang. Admin akan membalas dengan harga final dan invoice.</p>'
    +'</div></section>';
  }

  app.innerHTML=
  '<header class="hero"><img src="'+LOGO+'" onerror="this.onerror=null;this.src=LOGO_DATA" alt="Logo '+esc(CFG.biz)+'"><div><h1>'+esc(CFG.biz)+'</h1><p>'+esc(CFG.tagline)+'</p></div></header>'
  +'<div class="notice-final"><i>⚠️</i><div><b>Perhatian:</b> Orderan yg sudah masuk adalah hasil final, jika ada tambahan, wajib isi kembali form ini.</div></div>'
  +(CFG.notice?'<div class="notice">'+esc(CFG.notice)+'</div>':'')
  +'<section class="card"><div class="svc-title">PILIH JENIS LAYANAN</div><div class="opts" role="radiogroup" aria-label="Pilih Jenis Layanan">'
    +'<label class="opt svc-opt"><input type="radio" name="serviceType" value="jastip" data-f="serviceType"'+(!isAntar?' checked':'')+'><div><div class="svc-name">🛍️ Jastip Belanja</div><div class="small muted">Titip beli barang / makanan</div></div></label>'
    +'<label class="opt svc-opt"><input type="radio" name="serviceType" value="antar_paket" data-f="serviceType"'+(isAntar?' checked':'')+'><div><div class="svc-name">📦 Pengantaran Paket</div><div class="small muted">Kurir antar jemput paket</div></div></label>'
  +'</div></section>'
  +bodyHtml
  +'<section class="card"><h2 style="margin-bottom:12px">Cara pesan</h2><ol class="how"><li>Pilih jenis layanan (Jastip Belanja atau Pengantaran Paket) lalu lengkapi form di atas.</li><li>Tekan tombol hijau. WhatsApp terbuka dengan pesan yang sudah tersusun, tinggal kirim.</li><li>Admin membalas dengan invoice atau ongkir. Setelah pembayaran masuk, pesanan langsung diproses.</li></ol>'
    +(CFG.pay?'<p class="small muted" style="margin-top:12px">Cara pembayaran: '+esc(CFG.pay)+'</p>':'')+'</section>'
  +(faq?'<section class="card"><h2 style="margin-bottom:12px">Pertanyaan umum</h2>'+faq+'</section>':'')
  +'<p class="foot">'+esc(CFG.biz)+'</p>';
  refresh();
}
function refresh(){
  const isAntar=(D.serviceType==='antar_paket');
  const s=document.getElementById('sum');
  if(!s)return;
  if(isAntar){
    s.innerHTML='<div class="sumline"><span>Layanan</span><span>Pengantaran Paket</span></div><div class="sumline big"><span>Ongkos Kirim</span><span>Dihitung Admin</span></div><p class="small muted" style="margin-top:4px">Ongkos kirim disesuaikan dengan jarak rute penjemputan &amp; penerimaan.</p>';
  } else {
    const its=D.items.filter(i=>String(i.name).trim());
    let est=0,cnt=0;its.forEach(i=>{cnt+=(+i.qty||0);est+=(+i.qty||0)*(+i.price||0)});
    s.innerHTML='<div class="sumline"><span>Jumlah barang</span><span>'+cnt+'</span></div><div class="sumline big"><span>Perkiraan barang</span><span>'+(est?rp(est):'-')+'</span></div><p class="small muted" style="margin-top:4px">Belum termasuk fee jasa dan ongkir. Harga final dikonfirmasi admin.</p>';
  }
  const a=document.getElementById('send');
  if(!a)return;
  if(!waOk()){a.setAttribute('aria-disabled','true');a.href='#';document.getElementById('err').textContent='Nomor WhatsApp admin belum diatur di config.js.'}
  else{a.removeAttribute('aria-disabled');a.href=waHref()}
}
function fmtMoney(el){
  const pos=el.selectionStart==null?el.value.length:el.selectionStart;
  const before=el.value.slice(0,pos).replace(/\D/g,'').length;
  const out=num(el.value)?fmt(num(el.value)):'';el.value=out;
  let c=0,i=0;for(;i<out.length&&c<before;i++){if(/\d/.test(out[i]))c++}
  try{el.setSelectionRange(i,i)}catch(e){}
}
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.hasAttribute('data-money'))fmtMoney(t);
  if(t.dataset.f&&t.type!=='radio'){D[t.dataset.f]=t.value}
  else if(t.dataset.i!==undefined){const it=D.items[+t.dataset.i],k=t.dataset.k;it[k]=(k==='qty'||k==='price')?num(t.value):t.value}
  else return;
  document.getElementById('err').textContent='';
  saveDraft();refresh();
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='serviceType'){
    D.serviceType=t.value;
    saveDraft();
    build();
    return;
  }
  if(t.name==='ship'){
    D.ship=t.value;
    const ab=document.getElementById('addrBox');
    if(ab) ab.hidden=(D.ship==='ambil');
    const stLbl=document.getElementById('shipTimeLbl');
    const stIn=document.getElementById('f-shipTime');
    if(stLbl) stLbl.textContent = (D.ship==='ambil'?'Kapan perkiraan diambil (bebas ketik)':'Kapan waktu kirim (bebas ketik)');
    if(stIn) stIn.placeholder = (D.ship==='ambil'?'Contoh: Nanti sore sekitar jam 17.00 / Besok siang':'Contoh: Hari ini jam 16.00 / Besok pagi jam 10.00 / Secepatnya');
    saveDraft();
    refresh();
  }
});
app.addEventListener('click',async e=>{
  const send=e.target.closest('#send');
  if(send){
    e.preventDefault();
    if(!waOk()){document.getElementById('err').textContent='Nomor WhatsApp admin belum diatur di config.js.';return}
    const er=check();
    if(er){document.getElementById('err').textContent=er;return}
    document.getElementById('err').textContent='';

    const targetUrl=waHref();
    let createdNo='';
    
    // Simpan pesanan & kirim update real-time ke Dashboard Admin secara otomatis
    send.style.pointerEvents='none';
    send.textContent='Menyimpan & Menghubungkan ke WhatsApp...';

    if(window.MJJ_SYNC && window.MJJ_SYNC.submitCustomerOrder){
      try {
        const order=await window.MJJ_SYNC.submitCustomerOrder(D);
        if(order&&order.no) createdNo=order.no;
      } catch(err){
        console.warn('Sync order error:', err);
      }
    }

    toast('✅ Pesanan berhasil dicatat' + (createdNo ? ' (' + createdNo + ')' : '') + '! Membuka WhatsApp...');

    // Buka WhatsApp
    const w=window.open(targetUrl, '_blank');
    if(!w || w.closed || typeof w.closed === 'undefined'){
      window.location.href=targetUrl;
    }

    send.style.pointerEvents='';
    send.textContent=D.serviceType==='antar_paket'?'Kirim pesanan pengantaran lewat WhatsApp':'Kirim pesanan lewat WhatsApp';
    return;
  }
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='add'){D.items.push({name:'',link:'',note:'',qty:1,price:0});document.getElementById('items').innerHTML=D.items.map(itemHtml).join('');saveDraft();refresh();const n=app.querySelectorAll('#items [data-k="name"]');n[n.length-1].focus()}
  else if(act==='del'){if(D.items.length>1)D.items.splice(+b.dataset.idx,1);else D.items[0]={name:'',link:'',note:'',qty:1,price:0};document.getElementById('items').innerHTML=D.items.map(itemHtml).join('');saveDraft();refresh()}
  else if(act==='copy'){
    const er=check();if(er){document.getElementById('err').textContent=er;return}
    try{await navigator.clipboard.writeText(message());toast('Pesan disalin')}catch(err){toast('Pesan belum bisa disalin otomatis. Gunakan tombol WhatsApp.')}
  }
  else if(act==='reset'){D=blank();try{localStorage.removeItem(STORE)}catch(err){}build();toast('Form dikosongkan')}
});
build();
</script>
